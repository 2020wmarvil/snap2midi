name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU only, no CUDA libraries)
        run: python -m pip install -e ".[test]"

      # The screenshot-based and end-to-end tests need test images that are not
      # in the public repo; they skip themselves. What runs here: merge logic,
      # synthetic preprocessing checks and the CLI contract (JSON, exit codes).
      - name: Fast tests
        shell: pwsh
        run: |
          python -m pytest -q -rs
          $code = $LASTEXITCODE
          Write-Host "pytest exit code: $code"
          exit $code
