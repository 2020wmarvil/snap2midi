name: Release

# Push a tag like v0.1.0 to build the installer package, prove it installs on a
# clean Windows runner, and publish it as a GitHub release.
# Run manually (workflow_dispatch) to do everything except publishing; the
# package is then kept as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match pyproject version $version"
          }

      - name: Build the installer package
        run: python packaging/make_installer.py

      # Install from the package exactly as a user would, CPU only (runners have
      # no GPU). The installer ends with a self-check that imports everything and
      # finds Audiveris.
      - name: Test install
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "snap2midi-installer-*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\pkg"
          $installer = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter install.cmd | Select-Object -First 1
          & cmd /c $installer.FullName -Dir "$env:RUNNER_TEMP\snap2midi" -Gpu no -Force
          if ($LASTEXITCODE -ne 0) { throw "install failed with exit code $LASTEXITCODE" }

      - name: Installed CLI answers in JSON
        shell: pwsh
        run: |
          # The CLI is expected to fail here (missing file, exit code 2); do not let
          # PowerShell treat that non-zero exit as a step failure.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = & cmd /c "$env:RUNNER_TEMP\snap2midi\snap2midi.cmd" transcribe nope.png --json
          $code = $LASTEXITCODE
          $r = ($out -join "`n") | ConvertFrom-Json
          if ($code -ne 2 -or $r.ok -ne $false) { throw "unexpected CLI result (exit $code): $out" }
          Write-Host "CLI answered: exit $code, $($r.error)"
          exit 0

      - name: Keep the package (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: snap2midi-installer
          path: dist/snap2midi-installer-*.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "snap2midi-installer-*.zip" | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "snap2midi ${{ github.ref_name }}" --generate-notes
