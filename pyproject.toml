[project]
name = "snap2midi"
version = "0.1.0"
description = "Turn screenshots of piano sheet music into MusicXML and MIDI"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "homr==0.7.1",
    "music21>=10",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "rapidocr",
    "onnxruntime-gpu==1.32.0",
    # Desktop app: Qt widgets, score engraving, SVG rasterizing.
    "PySide6-Essentials>=6.8",
    "verovio>=5",
    "resvg_py>=0.5",
]

[project.optional-dependencies]
# NVIDIA CUDA + cuDNN libraries (about 1.4 GB). Without them homr runs on the CPU.
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.32.0"]
test = ["pytest"]

[project.scripts]
snap2midi = "snap2midi.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore"]
